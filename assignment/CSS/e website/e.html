<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProSport Gear</title>
    <link rel="stylesheet" href="e.css">
</head>
<body>

    <nav class="navbar">
        <h2>ProSport<span>.</span></h2>
    </nav>

    <header class="hero">
        <h1>Gear Up for <span>Greatness</span></h1>
        <p>Premium equipment for every athlete.</p>
    </header>

    <main class="product-container">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1519861531157-ea59b9467981?w=400" alt="Basketball">
            <h3>Pro Basketball</h3>
            <p class="price">$29.99</p>
            <button class="btn">Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1531565637446-32307b194362?w=400" alt="Cricket Bat">
            <h3>English Willow Bat</h3>
            <p class="price">$120.00</p>
            <button class="btn">Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=400" alt="Dumbbells">
            <h3>Hex Dumbbells</h3>
            <p class="price">$45.00</p>
            <button class="btn">Add to Cart</button>
        </div>
    </main>

</body>
</html>
