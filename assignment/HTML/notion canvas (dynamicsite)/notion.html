<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion - Midnight Edition</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #085eaf 0%, #000000 100%);
        }

        canvas {
            max-width: 95%;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

    <canvas id="heroCanvas" width="1100" height="500"></canvas>

    <script>
        const canvas = document.getElementById("heroCanvas");
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.roundRect(0, 0, canvas.width, canvas.height, 40); 
        ctx.fill();

        ctx.fillStyle = "#000814";
        ctx.font = "900 26px sans-serif";
        ctx.fillText("Motion", 60, 60);

        ctx.font = "600 16px sans-serif";
        ctx.fillStyle = "#555";
        ctx.fillText("Product", 720, 60);
        ctx.fillText("Solutions", 810, 60);
        ctx.fillText("Pricing", 910, 60);

        ctx.fillStyle = "#003566";
        ctx.beginPath();
        ctx.roundRect(980, 35, 80, 40, 8);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText("Login", 1000, 60);

        
        ctx.fillStyle = "#000814";
        ctx.font = "900 72px sans-serif";
        ctx.fillText("Scale", 80, 170);
        ctx.fillText("your ideas", 80, 245);
        ctx.fillStyle = "#0056b3"; // Color pop on last word
        ctx.fillText("faster.", 80, 320);

        ctx.fillStyle = "#666";
        ctx.font = "20px sans-serif";
        ctx.fillText("Bring your workflow into one unified space.", 80, 370);

        const blueGrad = ctx.createLinearGradient(80, 410, 240, 460);
        blueGrad.addColorStop(0, "#003566");
        blueGrad.addColorStop(1, "#0056b3");
        ctx.fillStyle = blueGrad;
        ctx.beginPath();
        ctx.roundRect(80, 410, 180, 55, 12);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText("Get Started", 115, 445);

        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(280, 410, 180, 55, 12);
        ctx.stroke();
        ctx.fillStyle = "#000";
        ctx.fillText("Watch Demo", 315, 445);


        ctx.strokeStyle = "#e5e5e5";
        ctx.lineWidth = 1;
        ctx.strokeRect(650, 150, 280, 220);

        const colors = ["#001d3d", "#003566", "#0077b6", "#00b4d8", "#90e0ef", "#caf0f8"];
        
        ctx.fillStyle = colors[0]; ctx.fillRect(670, 170, 70, 70);
        ctx.fillStyle = colors[1]; ctx.fillRect(755, 170, 70, 70);
        ctx.fillStyle = colors[2]; ctx.fillRect(840, 170, 70, 70);
        
        
        ctx.fillStyle = colors[3]; ctx.fillRect(670, 255, 70, 70);
        ctx.fillStyle = colors[4]; ctx.fillRect(755, 255, 155, 70); // Long block

        ctx.lineWidth = 3;
        
        ctx.strokeStyle = "#00b4d8";
        ctx.beginPath(); ctx.arc(980, 180, 35, 0, Math.PI * 2); ctx.stroke();
        
        ctx.strokeStyle = "#003566";
        ctx.beginPath(); ctx.arc(1000, 280, 45, 0, Math.PI * 2); ctx.stroke();

        ctx.strokeStyle = "#000814";
        ctx.beginPath(); ctx.arc(950, 380, 25, 0, Math.PI * 2); ctx.stroke();

       
        ctx.fillStyle = "#ffc300"; 
        ctx.beginPath();
        ctx.moveTo(610, 220);
        ctx.lineTo(630, 250);
        ctx.lineTo(590, 250);
        ctx.closePath();
        ctx.fill();

    </script>
</body>
</html>
