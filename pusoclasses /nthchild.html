<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:nth-child(odd){
            color: rgb(157, 2, 2);
    }
        li:nth-child(even){
            color: rgb(8, 48, 143);
    }
      li:nth-child(4){
            background-color: rgb(108, 255, 115);
    }
    </style>
</head>
<body>
    <h2>fruits list</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Mango</li>
        <li>Grapes</li>
    </ul>
</body>
</html>
