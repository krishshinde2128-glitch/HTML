<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    button{
        padding: 12px 24px;
        font-size: 16px;
        background-color: rgba(225, 225, 225, 0.622);
        border: none;
        cursor: pointer;
    }

    button:hover{
        background-color: rgb(3, 0, 174);
        color: white;
    }
    button:active{
        transform: scale(1.5);
        background-color: red;
    }
    input:focus{
        border: 2px solid seagreen;
        outline: none;
        color: red;
    }
    a {
        color: blue;
        text-decoration: none;
        font-size: 18px;
    }
    a:hover {
        text-decoration: underline;
        color: rgb(248, 171, 19);
    }
    a:visited {
        color: purple;
    }

    li:first-child {
        color: rgb(222, 32, 200);
    }
    li:last-child {
        color: rgb(29, 12, 140);
    }
    li:nth-child(4) {
        color: rgb(195, 185, 9);
    }
    </style>
</head>
<body>
    <h2>button hover</h2>
    <button>Hover Me!</button>
    <br><br>
    <h2>Input focus</h2>
    <input type="text" placeholder="click to focus">
    <br><br>
    <h2>visited link</h2>
    <a href="https://www.crazygames.com/game/aquapark-io-yky">Visit link</a>
    <br><br>
    <a href="https://gemini.google.com/app">Visit Gemini</a>
    <br><br>
    <h3>fruits list</h3>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Mango</li>
        <li>Grapes</li>
        <li>Pineapple</li>

    </ul>
</body>
</html>
